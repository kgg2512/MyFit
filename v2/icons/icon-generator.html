<!DOCTYPE html>
<html lang="ko">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https:; base-uri 'self'; object-src 'none'; form-action 'self'"/>
<meta charset="UTF-8">
<title>MyFit — 앱 아이콘 생성기</title>
<style>
  body { font-family: system-ui; background: #0d0d0d; color: #fff; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .item { text-align: center; font-size: 11px; color: #999; }
  canvas { display: block; margin-bottom: 4px; border-radius: 22%; }
  button { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 6px 14px;
           border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 4px; }
  .dl-all { background: #7C6FCD; color: #fff; border: none; padding: 10px 24px;
             border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
             margin-bottom: 20px; }
</style>
</head>
<body>
<h1>MyFit 아이콘 생성기</h1>
<button class="dl-all" onclick="downloadAll()">모두 다운로드</button>
<div class="grid" id="grid"></div>
<script>
const SIZES = [
  { size: 20, label: 'iOS 20' }, { size: 29, label: 'iOS 29' },
  { size: 40, label: 'iOS 40' }, { size: 58, label: 'iOS 58' },
  { size: 60, label: 'iOS 60' }, { size: 76, label: 'iOS 76' },
  { size: 80, label: 'iOS 80' }, { size: 87, label: 'iOS 87' },
  { size: 120, label: 'iOS 120' }, { size: 152, label: 'iOS 152' },
  { size: 167, label: 'iOS 167' }, { size: 180, label: 'iOS 180' },
  { size: 48, label: 'Android mdpi' }, { size: 72, label: 'Android hdpi' },
  { size: 96, label: 'Android xhdpi' }, { size: 144, label: 'Android xxhdpi' },
  { size: 192, label: 'Android xxxhdpi' }, { size: 512, label: 'Play Store' },
  { size: 1024, label: 'App Store' }
];

function drawMyFit(ctx, size) {
  const s = size;
  const u = s / 100;

  // 배경 — 딥 퍼플 그라디언트
  const bg = ctx.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#1a1535');
  bg.addColorStop(1, '#0d0b1e');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.22);
  ctx.fill();

  const cx = s * 0.5, cy = s * 0.48;

  // AI 스캔 원형 링들
  for (let i = 2; i >= 0; i--) {
    const r = u * (20 + i * 9);
    const alpha = 0.15 + i * 0.08;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(150,130,255,${alpha})`;
    ctx.lineWidth = u * 1.5;
    ctx.stroke();
  }

  // 사람 체형 실루엣 (정면)
  ctx.fillStyle = 'rgba(180,165,255,0.9)';
  ctx.strokeStyle = 'rgba(200,185,255,1)';
  ctx.lineWidth = u * 2;
  ctx.lineJoin = 'round';

  // 머리
  ctx.beginPath();
  ctx.arc(cx, cy - u * 26, u * 9, 0, Math.PI * 2);
  ctx.fill();

  // 몸통 (어깨-허리-골반)
  ctx.beginPath();
  ctx.moveTo(cx - u * 14, cy - u * 16);  // 왼어깨
  ctx.bezierCurveTo(cx - u * 15, cy - u * 10, cx - u * 10, cy, cx - u * 8, cy + u * 8); // 왼허리-골반
  ctx.lineTo(cx + u * 8, cy + u * 8);   // 골반 오른쪽
  ctx.bezierCurveTo(cx + u * 10, cy, cx + u * 15, cy - u * 10, cx + u * 14, cy - u * 16); // 오른허리-어깨
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 왼팔
  ctx.beginPath();
  ctx.moveTo(cx - u * 14, cy - u * 16);
  ctx.bezierCurveTo(cx - u * 22, cy - u * 8, cx - u * 24, cy + u * 2, cx - u * 20, cy + u * 10);
  ctx.lineWidth = u * 5;
  ctx.strokeStyle = 'rgba(180,165,255,0.85)';
  ctx.lineCap = 'round';
  ctx.stroke();

  // 오른팔
  ctx.beginPath();
  ctx.moveTo(cx + u * 14, cy - u * 16);
  ctx.bezierCurveTo(cx + u * 22, cy - u * 8, cx + u * 24, cy + u * 2, cx + u * 20, cy + u * 10);
  ctx.stroke();

  // 왼다리
  ctx.beginPath();
  ctx.moveTo(cx - u * 6, cy + u * 8);
  ctx.bezierCurveTo(cx - u * 8, cy + u * 18, cx - u * 8, cy + u * 26, cx - u * 7, cy + u * 34);
  ctx.stroke();

  // 오른다리
  ctx.beginPath();
  ctx.moveTo(cx + u * 6, cy + u * 8);
  ctx.bezierCurveTo(cx + u * 8, cy + u * 18, cx + u * 8, cy + u * 26, cx + u * 7, cy + u * 34);
  ctx.stroke();

  // AI 스캔 라인 (수평)
  for (let i = 0; i < 4; i++) {
    const y = cy - u * 14 + i * u * 9;
    const lineGrad = ctx.createLinearGradient(cx - u * 28, y, cx + u * 28, y);
    lineGrad.addColorStop(0, 'rgba(120,100,255,0)');
    lineGrad.addColorStop(0.5, 'rgba(160,140,255,0.4)');
    lineGrad.addColorStop(1, 'rgba(120,100,255,0)');
    ctx.beginPath();
    ctx.moveTo(cx - u * 28, y);
    ctx.lineTo(cx + u * 28, y);
    ctx.strokeStyle = lineGrad;
    ctx.lineWidth = u * 1;
    ctx.stroke();
  }

  // "M" 텍스트 (큰 사이즈)
  if (size >= 180) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = `bold ${u * 11}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('MyFit', cx, s * 0.93);
  }
}

const grid = document.getElementById('grid');
const canvases = {};

SIZES.forEach(({ size, label }) => {
  const item = document.createElement('div');
  item.className = 'item';
  const disp = Math.min(size, 100);
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  canvas.style.width = disp + 'px'; canvas.style.height = disp + 'px';
  drawMyFit(canvas.getContext('2d'), size);
  canvases[label] = canvas;
  const btn = document.createElement('button');
  btn.textContent = '저장';
  btn.onclick = () => download(canvas, `myfit-icon-${size}.png`);
  item.append(canvas, document.createTextNode(`${label} (${size}×${size})`), document.createElement('br'), btn);
  grid.append(item);
});

function download(canvas, name) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = name;
  a.click();
}

function downloadAll() {
  SIZES.forEach(({ size, label }) => {
    const c = canvases[label];
    setTimeout(() => download(c, `myfit-icon-${size}.png`), 100);
  });
}
</script>
</body>
</html>
