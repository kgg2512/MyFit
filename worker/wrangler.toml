# myfit-fashn-proxy — 폐기됨 (2026-07-14, 회장 확정: 가상피팅 외부벤더 전면 폐기)
# main 워커는 구 엔드포인트(/try-on, /g/*, /garment/*)에 410 Gone을 반환하는 스텁이다.
