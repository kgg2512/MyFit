#    그 전까지는 이 스텁을 배포(wrangler deploy)해 구 클라이언트 호출을 명시적으로 종료한다.
# 스텁은 KV·시크릿을 사용하지 않는다 (구 레이트리밋 KV 바인딩·벤더 키 참조 제거).

name = "myfit-fashn-proxy"
