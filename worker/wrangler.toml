# myfit-fashn-proxy — 가상피팅 이미지 프록시 Worker
# 2026-07-08 G2 보안감사 P0#1: 배포본 CF API 회수로 버전관리 복원.
#
# 배포: wrangler deploy   (main = 회수 번들 myfit-fashn-proxy.js)
# ⚠️ RATE_LIMIT_KV의 id는 CF 대시보드에서 확인해 채울 것(회수 시 부분값만 노출).
# ⚠️ 벤더 API키·서명키는 코드에 없음 → `wrangler secret put`으로만 등록(하드코딩 금지).

name = "myfit-fashn-proxy"
main = "myfit-fashn-proxy.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

# 레이트리밋 KV (배포된 워커 바인딩)
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_FROM_CF_DASHBOARD"   # settings 조회 시 085dd51cc8974c559d62dc29022f35a… (부분)

# 시크릿(값은 wrangler secret put 으로만): 벤더 API 키, 이미지 서명키 등
