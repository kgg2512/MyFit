<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MyFit Screenshot 3 — AI 피팅 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 800px; overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bg-orb-1 {
      position: absolute; top: -80px; right: 200px;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,77,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-orb-2 {
      position: absolute; bottom: -100px; left: 0;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .layout {
      display: flex;
      gap: 64px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* 왼쪽 패널: AI 피팅 결과 */
    .panel-mock {
      width: 360px;
      background: #141414;
      border-radius: 20px;
      border: 1px solid #222;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e1e;
      display: flex; align-items: center; gap: 10px;
    }
    .back-btn {
      width: 26px; height: 26px;
      background: #1e1e1e; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #666;
    }
    .header-title { font-size: 13px; font-weight: 600; color: #fff; }
    .tabs {
      display: flex; background: #1a1a1a; padding: 3px; gap: 2px;
    }
    .tab {
      flex: 1; padding: 7px; text-align: center;
      font-size: 11px; color: #555; border-radius: 6px;
    }
    .tab.active { background: #222; color: #7c4dff; font-weight: 600; }

    .panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .upload-label-done {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .upload-thumb {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .upload-info { flex: 1; }
    .upload-name { font-size: 12px; color: #fff; font-weight: 500; }
    .upload-size { font-size: 10px; color: #555; }
    .upload-change { font-size: 11px; color: #7c4dff; }

    /* AI 결과 이미지 모의 */
    .result-card {
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
    }
    .result-header {
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #222;
    }
    .result-label { font-size: 11px; color: #888; font-weight: 500; }
    .save-btn-sm {
      font-size: 11px; color: #7c4dff;
      background: rgba(124,77,255,0.1); border: 1px solid rgba(124,77,255,0.2);
      border-radius: 4px; padding: 3px 10px;
    }
    .result-img-mock {
      height: 220px;
      background: linear-gradient(170deg, #1e1a2e 0%, #12102a 50%, #0e0e1a 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    /* 사람 실루엣 + 옷 오버레이 */
    .human-silhouette {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      opacity: 0.85;
    }
    .h-head {
      width: 36px; height: 36px;
      background: rgba(255,200,160,0.3);
      border: 1.5px solid rgba(255,200,160,0.5);
      border-radius: 50%;
    }
    .h-neck { width: 12px; height: 10px; background: rgba(255,200,160,0.2); }
    .h-torso {
      width: 70px; height: 90px;
      background: linear-gradient(180deg, rgba(124,77,255,0.4) 0%, rgba(124,77,255,0.25) 100%);
      border: 1px solid rgba(124,77,255,0.5);
      border-radius: 8px 8px 4px 4px;
      position: relative;
    }
    .h-sleeve-l {
      position: absolute; top: 8px; left: -22px;
      width: 22px; height: 50px;
      background: rgba(124,77,255,0.3);
      border: 1px solid rgba(124,77,255,0.4);
      border-radius: 6px;
      transform: rotate(5deg);
    }
    .h-sleeve-r {
      position: absolute; top: 8px; right: -22px;
      width: 22px; height: 50px;
      background: rgba(124,77,255,0.3);
      border: 1px solid rgba(124,77,255,0.4);
      border-radius: 6px;
      transform: rotate(-5deg);
    }
    .h-pants {
      width: 70px; height: 70px;
      background: rgba(40,40,70,0.8);
      border: 1px solid rgba(100,100,150,0.3);
      border-radius: 0 0 6px 6px;
      display: flex; gap: 4px; padding: 0 8px;
    }
    .h-leg { flex: 1; background: rgba(40,40,70,0.9); border-radius: 0 0 4px 4px; }

    .fashn-badge {
      position: absolute; bottom: 10px; right: 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(124,77,255,0.3);
      border-radius: 4px; padding: 3px 8px;
      font-size: 9px; color: rgba(124,77,255,0.8);
      letter-spacing: 0.05em;
    }

    .disclaimer { font-size: 10px; color: #333; text-align: center; padding: 8px; }

    .pmf-block {
      background: #1a1a1a; border: 1px solid #242424; border-radius: 10px; padding: 12px 14px;
    }
    .pmf-q { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 10px; }
    .pmf-btns { display: flex; gap: 8px; }
    .pmf-btn {
      flex: 1; padding: 8px;
      border-radius: 7px; font-size: 12px; font-weight: 500;
      text-align: center;
    }
    .pmf-yes {
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.25);
      color: #00e5ff;
    }
    .pmf-no {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #555;
    }

    /* 오른쪽 설명 */
    .right-info {
      width: 460px;
      color: #fff;
    }
    .right-tag {
      font-size: 11px; letter-spacing: 0.2em; color: #7c4dff;
      text-transform: uppercase; margin-bottom: 20px; opacity: 0.8;
    }
    .right-title {
      font-size: 42px; font-weight: 700; line-height: 1.2; margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .right-desc {
      font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.7; margin-bottom: 36px;
    }
    .tech-badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .tech-badge {
      padding: 8px 16px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      font-size: 12px; color: rgba(255,255,255,0.6);
      display: flex; align-items: center; gap: 6px;
    }
    .tech-dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-cyan { background: #00e5ff; }
    .dot-purple { background: #7c4dff; }

    .stat-row { display: flex; gap: 40px; margin-top: 36px; }
    .stat-item { display: flex; flex-direction: column; gap: 4px; }
    .stat-num { font-size: 32px; font-weight: 700; color: #7c4dff; }
    .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="bg-orb-1"></div>
  <div class="bg-orb-2"></div>

  <div class="layout">
    <!-- 왼쪽 패널 -->
    <div class="panel-mock">
      <div class="panel-header">
        <div class="back-btn">←</div>
        <div class="header-title">크루넥 스웨트셔츠</div>
      </div>
      <div class="tabs">
        <div class="tab">3D 가이드</div>
        <div class="tab active">AI 피팅</div>
        <div class="tab">핏 분석</div>
      </div>
      <div class="panel-body">
        <div class="upload-label-done">
          <div class="upload-thumb">📷</div>
          <div class="upload-info">
            <div class="upload-name">my_photo.jpg</div>
            <div class="upload-size">전신 정면 사진</div>
          </div>
          <div class="upload-change">변경</div>
        </div>

        <div class="result-card">
          <div class="result-header">
            <div class="result-label">AI 피팅 결과</div>
            <div class="save-btn-sm">저장</div>
          </div>
          <div class="result-img-mock">
            <div class="human-silhouette">
              <div class="h-head"></div>
              <div class="h-neck"></div>
              <div class="h-torso">
                <div class="h-sleeve-l"></div>
                <div class="h-sleeve-r"></div>
              </div>
              <div class="h-pants">
                <div class="h-leg"></div>
                <div class="h-leg"></div>
              </div>
            </div>
            <div class="fashn-badge">FASHN AI</div>
          </div>
          <div class="disclaimer">AI 생성 이미지입니다. 실제 착용과 차이가 있을 수 있습니다.</div>
        </div>

        <div class="pmf-block">
          <div class="pmf-q">이 피팅 결과, 구매에 도움이 됐나요?</div>
          <div class="pmf-btns">
            <div class="pmf-btn pmf-yes">도움 됐어요</div>
            <div class="pmf-btn pmf-no">별로예요</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 설명 -->
    <div class="right-info">
      <div class="right-tag">FASHN AI Powered</div>
      <div class="right-title">내 체형에<br>옷을 입혀드립니다</div>
      <div class="right-desc">
        내 사진 한 장만 업로드하면<br>
        FASHN AI가 실제 착용 시뮬레이션을<br>
        15~30초 안에 생성합니다.
      </div>
      <div class="tech-badges">
        <div class="tech-badge">
          <div class="tech-dot dot-purple"></div>
          FASHN AI 기술
        </div>
        <div class="tech-badge">
          <div class="tech-dot dot-cyan"></div>
          처리 후 즉시 삭제
        </div>
        <div class="tech-badge">
          <div class="tech-dot dot-purple"></div>
          15~30초 내 생성
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-num">5곳</div>
          <div class="stat-label">지원 쇼핑몰</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">0원</div>
          <div class="stat-label">무료 사용</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">1번</div>
          <div class="stat-label">치수 입력</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
